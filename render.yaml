services:
  - type: web
    name: portfolio-khushi-gadyal
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: /api
      - key: PORT
        value: 10000
      -services:
  - type: web
    name: portfolio-khushi-gadyal
    env: node
    plan: free

    buildCommand: npm run build
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production

      - key: VITE_API_URL
        value: /api

      - key: PORT
        value: "10000"

      - key: MONGODB_URI
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: ADMIN_USERNAME
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      - key: ADMIN_SECRET
        sync: false